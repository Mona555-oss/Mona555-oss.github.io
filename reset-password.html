<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alf Leila - Reset Password</title>
    <!-- Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; padding-top: 50px; background-color: #f4f7f6; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 350px; text-align: center; }
        h2 { color: #008080; margin-bottom: 10px; }
        p { color: #666; font-size: 14px; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #008080; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        #message { margin-top: 15px; font-size: 14px; color: #d32f2f; min-height: 20px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>New Password</h2>
        <p>Enter a new password for your account.</p>
        <input type="password" id="new-password" placeholder="Minimum 6 characters">
        <button id="update-btn" onclick="handleReset()">Update Password</button>
        <p id="message"></p>
    </div>

    <script>
        // 1. Replace these with your EXACT credentials from Supabase settings
        const SUPABASE_URL = "https://rdtxtuuqlqvluwuneyta.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJkdHh0dXVxbHF2bHV3dW5leXRhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTQzOTQ5NzUsImV4cCI6MjA2OTk3MDk3NX0.KoPNxc3f47et5IVSGVdeZdqwBRWBx0pyMNw_SktKQPM"; 
        
        // 2. Initialize client (using a different name to avoid conflict)
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function handleReset() {
            const newPassword = document.getElementById('new-password').value;
            const btn = document.getElementById('update-btn');
            const msg = document.getElementById('message');

            if (!newPassword || newPassword.length < 6) {
                msg.style.color = "#d32f2f";
                msg.innerText = "Password must be at least 6 characters.";
                return;
            }

            msg.innerText = "";
            btn.disabled = true;
            btn.innerText = "Updating...";

            try {
                // This function uses the access_token automatically extracted from the URL fragment (#)
                const { error } = await supabaseClient.auth.updateUser({ 
                    password: newPassword 
                });

                if (error) {
                    msg.style.color = "#d32f2f";
                    msg.innerText = "Error: " + error.message;
                    btn.disabled = false;
                    btn.innerText = "Update Password";
                } else {
                    msg.style.color = "#008080";
                    msg.innerText = "Success! Password updated. You can now close this page and log in to the app.";
                    btn.style.display = "none";
                    document.getElementById('new-password').style.display = "none";
                }
            } catch (err) {
                console.error(err);
                msg.innerText = "An unexpected error occurred.";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
