<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SilentSpace - Reset Password</title>
    <!-- Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; padding-top: 50px; background-color: #f4f7f6; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 350px; }
        h2 { color: #008080; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #008080; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        #message { margin-top: 15px; font-size: 14px; color: #d32f2f; }
    </style>
</head>
<body>
    <div class="card">
        <h2>New Password</h2>
        <p>Enter a new password for your SilentSpace account.</p>
        <input type="password" id="new-password" placeholder="Minimum 6 characters">
        <button id="update-btn" onclick="handleReset()">Update Password</button>
        <p id="message"></p>
    </div>

    <script>
        // TODO: Replace with your actual Supabase credentials
        const SUPABASE_URL = "https://rdtxtuuqlqvluwuneyta.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJkdHh0dXVxbHF2bHV3dW5leXRhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTQzOTQ5NzUsImV4cCI6MjA2OTk3MDk3NX0.KoPNxc3f47et5IVSGVdeZdqwBRWBx0pyMNw_SktKQPM"; 
        
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function handleReset() {
            const newPassword = document.getElementById('new-password').value;
            const btn = document.getElementById('update-btn');
            const msg = document.getElementById('message');

            if (newPassword.length < 6) {
                msg.innerText = "Password must be at least 6 characters.";
                return;
            }

            btn.disabled = true;
            btn.innerText = "Updating...";

            // This function uses the access_token automatically extracted from the URL fragment
            const { error } = await supabase.auth.updateUser({ password: newPassword });

            if (error) {
                msg.style.color = "#d32f2f";
                msg.innerText = "Error: " + error.message;
                btn.disabled = false;
                btn.innerText = "Update Password";
            } else {
                msg.style.color = "#008080";
                msg.innerText = "Success! You can now close this page and log in to the SilentSpace app.";
                btn.style.display = "none";
                document.getElementById('new-password').style.display = "none";
            }
        }
    </script>
</body>
</html>
