name: Build and Deploy Web App
on:
  push:
    branches:
      - source # GitHub runs this whenever you push to the 'source' branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Wasm App
        run: ./gradlew :webApp:wasmJsBrowserDistribution

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: webApp/build/dist/wasmJs/productionExecutable
          branch: main # This pushes the build results to your live branch (mona555-oss.github.io)
