<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Confirmed</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            background: white;
            width: 500px;
            max-width: 90%;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.12);
            text-align: center;
        }

        h1 {
            color: #0a8a8a;
            font-size: 42px;
            margin-bottom: 20px;
        }

        p {
            color: #333;
            font-size: 22px;
            line-height: 1.5;
            margin-bottom: 35px;
        }

        .success-icon {
            font-size: 70px;
            margin-bottom: 20px;
        }

        .button {
            display: inline-block;
            background: #0a8a8a;
            color: white;
            text-decoration: none;
            padding: 16px 36px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
        }

        .button:hover {
            background: #087474;
        }
    </style>
</head>
<body>

<div class="card">

    <h1>Welcome!</h1>

    <p>
        Welcome to <strong>Majnun Layla</strong>.<br><br>
        Your account has been confirmed successfully!
    </p>

    <p>You may now return to the app </p>

</div>

</body>
</html>
